services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-potencializador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-potencializador}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending migrations as the schema owner, then exits.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/src/infrastructure/migrate-cli.ts']
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-potencializador}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-potencializador}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      # Comma-separated emails of the mentoring firm's people; created on start if missing.
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # The API connects as the restricted role, never as the schema owner.
      DATABASE_URL: postgres://potencializador_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-potencializador}
      # Address the browser uses; sign-in callbacks are built from it.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  db-data:
